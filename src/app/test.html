<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login RTC</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: black;
            font-family: 'Courier New', Courier, monospace;
            color: lime;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #ascii {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            white-space: pre;
            font-size: 12px;
            line-height: 12px;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 350px;
            padding: 20px;
            border: 1px solid lime;
            background: rgba(0,0,0,0.8);
            box-shadow: 0 0 20px lime;
            box-sizing: border-box;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: black;
            border: 1px solid lime;
            color: lime;
            box-sizing: border-box;
        }

        .login-container button {
            width: 100%;
            padding: 10px;
            background: lime;
            color: black;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .login-container button:hover {
            background: darkgreen;
            color: lime;
        }

        .google-btn {
            background: #4285F4;
            color: white;
        }

        .google-btn:hover {
            background: #357ae8;
        }
    </style>
</head>
<body>

<div id="ascii"></div>

<div class="login-container">
    <h2>ACCESS TERMINAL</h2>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button>LOGIN</button>
    <button class="google-btn"><i class="fab fa-google"></i> Login with Google</button>
</div>

<script>
    const asciiContainer = document.getElementById('ascii');
    const characters = '01abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%^&*()_+=-<>?/[]{}|';

    function createAsciiRow() {
        let row = '';
        const cols = Math.ceil(window.innerWidth / 7);
        for (let i = 0; i < cols; i++) {
            row += characters.charAt(Math.floor(Math.random() * characters.length));
        }
        return row + '\n';
    }

    function renderAscii() {
        asciiContainer.textContent += createAsciiRow();
        const rows = Math.ceil(window.innerHeight / 12);
        let currentRows = asciiContainer.textContent.split('\n');
        if (currentRows.length > rows) {
            currentRows.shift();
            asciiContainer.textContent = currentRows.join('\n');
        }
    }

    setInterval(renderAscii, 30);

    window.addEventListener('resize', () => asciiContainer.textContent = '');
</script>

</body>
</html>
